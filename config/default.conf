# GhostPillage Default Configuration
# ===================================
# Yeh file default values provide karti hai CLI arguments ki jagah.
# Har setting main.py ke argparse default ke override karti hai.

[General]
# Default interface (auto-detect if empty)
interface = 

# Logging verbosity (true/false)
verbose = true

# Working directory for temp files
config_dir = /tmp/ghostpillage

[Recon]
# Default scan timeout (seconds)
scan_timeout = 30

# Auto-detect target from scan (true/false)
auto_detect = true

# Output formats
output_formats = csv,json

[GhostAP]
# Default channel (0 = auto)
channel = 6

# Default EAP method
eap_method = PEAP,TTLS,TLS

# Certificate directory (leave empty for default)
cert_dir = /etc/hostapd-wpe/certs

# Hide SSID (true/false)
hide_ssid = false

[Deauth]
# Default interval between deauth bursts (seconds)
interval = 5

# Deauth all clients or specific (all/targeted)
mode = all

# Auto-stop deauth after client connects to rogue AP (true/false)
auto_stop = true

[Pillage]
# Enable traffic interception (true/false)
enabled = true

# Capture file types
capture_types = all

[Crack]
# Default wordlist (empty for auto-detect)
wordlist = /usr/share/wordlists/rockyou.txt.gz

# Hashcat mode for enterprise hashes
hashcat_mode = 5500

# Rules file for hashcat
rules_file = /usr/share/hashcat/rules/best64.rule